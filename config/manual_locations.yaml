# 人工地址覆蓋設定檔 (manual_locations.yaml)
# 規範：
# 1. 本檔案僅允許填寫人工查核之「位置、精度與查證證據」。
# 2. distance_min_m、distance_max_m 與 distance_verified 嚴禁手填，一律由計算管線依幾何自動推導。
# 3. 查核證據必須具體記錄查證管道（如地政事務所謄本、地籍套繪圖、門牌編釘對照表）。

